<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Visual baseline fixture</title>
    <style>
      :root { color-scheme: light; font-family: ui-sans-serif, system-ui, sans-serif; background: #fff7ed; color: #351a0f; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      .shell { width: min(720px, calc(100vw - 48px)); }
      h1 { margin: 0 0 8px; font-size: 32px; }
      .status { margin: 0 0 24px; color: #9a3412; }
      .summary-card { border: 3px solid #f97316; border-radius: 4px; padding: 28px; background: #ffedd5; box-shadow: 0 16px 36px rgba(154, 52, 18, .24); }
      .summary-card strong { display: block; margin-bottom: 8px; font-size: 18px; }
      .summary-card span { color: #9a3412; }
    </style>
  </head>
  <body>
    <main class="shell" data-visual-baseline-summary>
      <h1>Visual baseline</h1>
      <p class="status">Changed</p>
      <section class="summary-card"><strong>Summary card</strong><span>The controlled visual regression is active.</span></section>
    </main>
  </body>
</html>
