<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Visual baseline fixture</title>
    <style>
      :root { color-scheme: light; font-family: ui-sans-serif, system-ui, sans-serif; background: #fff5f5; color: #172033; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      .shell { width: min(720px, calc(100vw - 48px)); }
      h1 { margin: 0 0 8px; font-size: 32px; }
      .status { margin: 0 0 24px; color: #4b5875; }
      .summary-card { border: 1px solid #d8deeb; border-radius: 16px; padding: 28px; background: white; box-shadow: 0 12px 32px rgba(41, 54, 84, .12); }
      .summary-card strong { display: block; margin-bottom: 8px; font-size: 18px; }
      .summary-card span { color: #53617b; }
    </style>
  </head>
  <body>
    <main class="shell" data-testid=visual-baseline-summary data-visual-baseline-summary>
      <h1>Visual baseline</h1>
      <p class="status">Changed</p>
      <section class="summary-card"><strong>Summary card</strong><span>A controlled visual regression is active.</span></section>
    </main>
  </body>
</html>
